<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".86" numOctaves="3" seed="17" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.8" intercept="-.4"/>
      <feFuncG type="linear" slope="1.8" intercept="-.4"/>
      <feFuncB type="linear" slope="1.8" intercept="-.4"/>
    </feComponentTransfer>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)"/>
</svg>
